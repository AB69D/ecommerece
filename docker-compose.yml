name: ab9d-ecommerce

services:
  # ── MongoDB Replica Set (3-member, single-VPS) ───────────────────────────────
  mongo1:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo1-data:/data/db
      - mongo1-config:/data/configdb
    networks:
      - app
    healthcheck:
      # TCP-only: passes as soon as mongod accepts connections. No auth needed.
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/27017' 2>/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  mongo2:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo2-data:/data/db
      - mongo2-config:/data/configdb
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/27017' 2>/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  mongo3:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo3-data:/data/db
      - mongo3-config:/data/configdb
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/27017' 2>/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # One-shot init: configures the replica set then exits. Idempotent.
  mongo-rs-init:
    image: mongo:7
    restart: "no"
    depends_on:
      mongo1:
        condition: service_healthy
      mongo2:
        condition: service_healthy
      mongo3:
        condition: service_healthy
    networks:
      - app
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        echo "[rs-init] initiating replica set rs0"
        mongosh --host mongo1:27017 \
          -u "$$MONGO_ROOT_USER" -p "$$MONGO_ROOT_PASSWORD" \
          --authenticationDatabase admin \
          --eval '
            var status = rs.status();
            if (status.ok === 1) {
              print("[rs-init] replica set already initiated, skipping");
            } else {
              rs.initiate({
                _id: "rs0",
                members: [
                  { _id: 0, host: "mongo1:27017", priority: 2 },
                  { _id: 1, host: "mongo2:27017", priority: 1 },
                  { _id: 2, host: "mongo3:27017", priority: 1 }
                ]
              });
              print("[rs-init] rs.initiate() sent, waiting for PRIMARY...");
              var tries = 30;
              while (tries-- > 0) {
                var s = rs.status();
                if (s.members && s.members.some(function(m){ return m.stateStr === "PRIMARY"; })) {
                  print("[rs-init] PRIMARY elected");
                  break;
                }
                sleep(2000);
              }
            }
          '
    environment:
      MONGO_ROOT_USER: ${MONGO_ROOT_USER}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mongo1:
        condition: service_healthy
      mongo2:
        condition: service_healthy
      mongo3:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      LOG_LEVEL: info
      TENANT_ENFORCEMENT: "true"
      FRONTEND_URL: ${FRONTEND_URL}
      MONGODB_URI: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo1:27017,mongo2:27017,mongo3:27017/${MONGO_APP_DB}?authSource=admin&replicaSet=rs0
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      API_KEY: ${BREVO_API_KEY}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    networks:
      - app

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
    networks:
      - app

  mongo-backup:
    image: mongo:7
    restart: unless-stopped
    depends_on:
      mongo1:
        condition: service_healthy
    environment:
      MONGO_ROOT_USER: ${MONGO_ROOT_USER}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      BACKUP_B2_BUCKET: ${BACKUP_B2_BUCKET}
      B2_ACCOUNT_ID: ${B2_ACCOUNT_ID}
      B2_ACCOUNT_KEY: ${B2_ACCOUNT_KEY}
    volumes:
      - ./backups:/backups
    networks:
      - app
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        if ! command -v rclone &>/dev/null; then
          curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip
          unzip -qo /tmp/rclone.zip -d /tmp/rclone-bin
          install -m 755 /tmp/rclone-bin/rclone-*/rclone /usr/local/bin/rclone
          rm -rf /tmp/rclone.zip /tmp/rclone-bin
        fi
        mkdir -p /backups
        while true; do
          TS=$$(date -u +%Y%m%dT%H%M%SZ)
          OUT=/backups/mongo-$$TS.archive.gz
          mongodump --host "mongo1:27017,mongo2:27017,mongo3:27017" --replicaSet rs0 \
            -u "$$MONGO_ROOT_USER" -p "$$MONGO_ROOT_PASSWORD" --authenticationDatabase admin \
            --archive=$$OUT --gzip
          find /backups -name 'mongo-*.archive.gz' -mtime +7 -delete
          if [ -n "$$BACKUP_B2_BUCKET" ] && [ -n "$$B2_ACCOUNT_ID" ] && [ -n "$$B2_ACCOUNT_KEY" ]; then
            rclone copy $$OUT ":b2,account=$$B2_ACCOUNT_ID,key=$$B2_ACCOUNT_KEY:$$BACKUP_B2_BUCKET/mongo/" --b2-hard-delete
          fi
          sleep 86400
        done

volumes:
  mongo1-data:
  mongo1-config:
  mongo2-data:
  mongo2-config:
  mongo3-data:
  mongo3-config:
  caddy-data:
  caddy-config:
  uploads:

networks:
  app:
    driver: bridge
