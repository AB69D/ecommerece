name: ab9d-ecommerce

services:
  # ── MongoDB Replica Set (3-member, single-VPS) ───────────────────────────────
  # No --auth flag: MongoDB auth is disabled so the backend can connect with
  # whatever MONGODB_URI is in the host's .env (no credentials needed on the
  # internal Docker network). Add --auth back when you need strict security.
  mongo1:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo1-data:/data/db
      - mongo1-config:/data/configdb
    networks:
      app:
        aliases:
          - mongo
    healthcheck:
      # TCP-only: passes as soon as mongod accepts connections — no auth dependency.
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/27017' 2>/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  mongo2:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo2-data:/data/db
      - mongo2-config:/data/configdb
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/27017' 2>/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  mongo3:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo3-data:/data/db
      - mongo3-config:/data/configdb
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/27017' 2>/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # One-shot init: configures the replica set then exits. Idempotent.
  # No auth needed because MongoDB is running without --auth.
  mongo-rs-init:
    image: mongo:7
    restart: "no"
    depends_on:
      mongo1:
        condition: service_healthy
      mongo2:
        condition: service_healthy
      mongo3:
        condition: service_healthy
    networks:
      - app
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        echo "[rs-init] checking replica set status"
        STATUS_OK=$(mongosh --host mongo1:27017 --quiet --eval 'rs.status().ok' 2>/dev/null || echo 0)
        if [ "$STATUS_OK" = "1" ]; then
          echo "[rs-init] replica set already initiated, skipping"
          exit 0
        fi
        echo "[rs-init] initiating replica set rs0"
        mongosh --host mongo1:27017 --eval '
          rs.initiate({
            _id: "rs0",
            members: [
              { _id: 0, host: "mongo1:27017", priority: 2 },
              { _id: 1, host: "mongo2:27017", priority: 1 },
              { _id: 2, host: "mongo3:27017", priority: 1 }
            ]
          });
          print("[rs-init] initiate sent, waiting for PRIMARY...");
          var tries = 30;
          while (tries-- > 0) {
            var s = rs.status();
            if (s.members && s.members.some(function(m){ return m.stateStr === "PRIMARY"; })) {
              print("[rs-init] PRIMARY elected");
              quit(0);
            }
            sleep(2000);
          }
          print("[rs-init] WARNING: PRIMARY not elected within 60s");
        '

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mongo1:
        condition: service_healthy
      mongo2:
        condition: service_healthy
      mongo3:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      LOG_LEVEL: info
      TENANT_ENFORCEMENT: "true"
      FRONTEND_URL: ${FRONTEND_URL}
      # MONGODB_URI is taken directly from the host's .env.
      # Default connects to the replica set without auth (suitable for the
      # internal Docker network). Set MONGODB_URI in .env to override, e.g.:
      #   MONGODB_URI=mongodb://user:pass@mongo1:27017,mongo2:27017,mongo3:27017/mydb?authSource=admin&replicaSet=rs0
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo1:27017,mongo2:27017,mongo3:27017/ab9d-ecommerce?replicaSet=rs0}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      API_KEY: ${BREVO_API_KEY}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    networks:
      - app

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
    networks:
      - app

volumes:
  mongo1-data:
  mongo1-config:
  mongo2-data:
  mongo2-config:
  mongo3-data:
  mongo3-config:
  caddy-data:
  caddy-config:
  uploads:

networks:
  app:
    driver: bridge
