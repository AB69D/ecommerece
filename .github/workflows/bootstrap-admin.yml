name: Bootstrap Admin Account

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
      VPS_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
    steps:
      - name: Set up SSH
        env:
          SSH_KEY_B64: ${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_deploy
          echo "${SSH_KEY_B64}" | base64 -d > ~/.ssh/id_deploy
          ssh-keyscan -p "${VPS_PORT}" -H "${VPS_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Create owner admin in MongoDB
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -p "${VPS_PORT}" \
              "${VPS_USER}@${VPS_HOST}" bash -s <<'ENDSSH'
          set -e
          cd /opt/ab9d-ecommerce

          echo "=== Creating owner admin account ==="
          docker compose exec -T mongo1 mongosh ab9d-ecommerce --quiet --eval '
            // Get the primary tenant
            var tenant = db.tenants.findOne({ isPrimary: true });
            if (!tenant) {
              print("ERROR: No primary tenant found. Run the backend first.");
              quit(1);
            }
            print("Tenant ID: " + tenant._id);
            print("Tenant subdomain: " + tenant.subdomain);

            // Check if owner already exists
            var existing = db.admins.findOne({ username: "owner" });
            if (existing) {
              print("Admin owner already exists — updating password and flags...");
              db.admins.updateOne(
                { username: "owner" },
                {
                  $set: {
                    passwordHash: "$2a$10$BT/vP6Y8gNyFACMnpCWEeuAce9STKoisVyiSsF036L7ssnsq.66aO",
                    email: "khanabid7474@gmail.com",
                    isActive: true,
                    isPlatformOwner: true,
                    role: "super-admin",
                    tenantId: tenant._id
                  }
                }
              );
              print("Updated.");
            } else {
              print("Creating new admin: owner");
              db.admins.insertOne({
                username: "owner",
                passwordHash: "$2a$10$BT/vP6Y8gNyFACMnpCWEeuAce9STKoisVyiSsF036L7ssnsq.66aO",
                email: "khanabid7474@gmail.com",
                fullName: "Platform Owner",
                role: "super-admin",
                permissions: [],
                isActive: true,
                isPlatformOwner: true,
                tenantId: tenant._id,
                addedBy: "bootstrap",
                createdAt: new Date(),
                updatedAt: new Date()
              });
              print("Created.");
            }

            // Verify
            var admin = db.admins.findOne({ username: "owner" }, { passwordHash: 0 });
            print("=== Admin record ===");
            print(JSON.stringify(admin, null, 2));
          '

          echo ""
          echo "=== Verifying login endpoint ==="
          RESP=$(curl -s -X POST http://127.0.0.1:8080/api/admin/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"owner","password":"123456"}' 2>/dev/null)
          echo "Response: $RESP"
          if echo "$RESP" | grep -q '"success":true'; then
            echo ""
            echo "LOGIN SUCCESS — owner / 123456 works!"
          else
            echo ""
            echo "WARNING: login response did not show success. Check the response above."
          fi
          ENDSSH
