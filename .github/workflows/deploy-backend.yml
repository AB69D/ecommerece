name: Deploy backend to VPS

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - 'Caddyfile'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: # allow manual trigger from the Actions tab
  # last triggered: 2026-06-15 retry-2

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
      VPS_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
    steps:
      - name: Set up SSH
        env:
          SSH_KEY_B64: ${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail

          if [ -z "${VPS_HOST}" ]; then
            echo "::error::VPS_HOST secret is not set."
            exit 1
          fi
          if [ -z "${SSH_KEY_B64}" ]; then
            echo "::error::VPS_SSH_PRIVATE_KEY_B64 secret is not set."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Decode base64 key — zero newline/encoding issues.
          install -m 600 /dev/null ~/.ssh/id_deploy
          echo "${SSH_KEY_B64}" | base64 -d > ~/.ssh/id_deploy

          echo "Key: $(wc -l < ~/.ssh/id_deploy) lines, $(wc -c < ~/.ssh/id_deploy) bytes"

          if ! ssh-keygen -y -f ~/.ssh/id_deploy >/dev/null 2>&1; then
            echo "::error::VPS_SSH_PRIVATE_KEY_B64 decoded key is invalid."
            exit 1
          fi
          echo "SSH key validated OK"

          ssh-keyscan -p "${VPS_PORT}" -H "${VPS_HOST}" >> ~/.ssh/known_hosts 2>/dev/null \
            || echo "::warning::ssh-keyscan miss — using StrictHostKeyChecking=accept-new"

      - name: Verify SSH connectivity
        run: |
          set -euo pipefail
          if ! ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
                 -p "${VPS_PORT}" "${VPS_USER}@${VPS_HOST}" 'echo "SSH OK on $(hostname)"'; then
            echo "::error::Could not SSH to ${VPS_USER}@${VPS_HOST}:${VPS_PORT}. Verify VPS_HOST/VPS_USER/VPS_SSH_PORT and that this key's public half is in the VPS ~/.ssh/authorized_keys."
            exit 1
          fi

      - name: Pull + rebuild backend on VPS
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -p "${VPS_PORT}" \
              "${VPS_USER}@${VPS_HOST}" bash -s <<'EOF'
          set -euo pipefail
          cd /opt/ab9d-ecommerce

          # Caddy owns port 80. Any system nginx (Contabo default install) must be
          # stopped and disabled so the two don't race for the port.
          if systemctl is-active --quiet nginx 2>/dev/null; then
            echo "Stopping system nginx (conflicts with Caddy on port 80)..."
            sudo systemctl stop nginx
            sudo systemctl disable nginx
          fi

          echo "Current commit (before): $(git rev-parse --short HEAD)"
          git fetch --quiet origin main
          git reset --hard origin/main
          echo "Current commit (after):  $(git rev-parse --short HEAD)"

          echo "=== Docker disk usage ==="
          docker system df 2>/dev/null || true

          echo "=== Building backend ==="
          docker compose up -d --build backend 2>&1
          echo "=== Build complete. Container status ==="
          docker compose ps backend

          echo "=== Early backend logs (first 30s) ==="
          sleep 5
          docker compose logs --tail=30 backend

          # always restart caddy so it can bind port 80 now that nginx is gone
          docker compose up -d --force-recreate caddy
          echo "=== Caddy status ==="
          docker compose ps caddy

          # wait for health (caddy proxies / → backend:8080 → /healthz JSON)
          # 60 iterations × 2s = 120s max wait
          for i in $(seq 1 60); do
            STATUS=$(curl -s -o /tmp/healthz_resp.txt -w "%{http_code}" -m 5 http://127.0.0.1/healthz 2>/dev/null || echo "000")
            BODY=$(cat /tmp/healthz_resp.txt 2>/dev/null || echo "")
            if echo "$BODY" | grep -q '"status"'; then
              echo "Backend healthy after $i attempts (HTTP $STATUS): $BODY"
              exit 0
            fi
            echo "Attempt $i/$((60)): HTTP $STATUS — $BODY"
            sleep 2
          done
          echo "=== BACKEND DID NOT BECOME HEALTHY ==="
          echo "=== Backend logs (last 100 lines) ==="
          docker compose logs --tail=100 backend
          echo "=== Caddy logs ==="
          docker compose logs --tail=30 caddy
          echo "=== Container status ==="
          docker compose ps
          echo "=== Direct backend port check (bypass Caddy) ==="
          curl -fsS -m 5 http://127.0.0.1:8080/healthz 2>&1 || echo "Direct port 8080 unreachable"
          exit 1
          EOF
