name: Deploy backend to VPS

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - 'Caddyfile'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: # allow manual trigger from the Actions tab
  # last triggered: 2026-06-15 retry-2

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
      VPS_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
    steps:
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${VPS_HOST}" ]; then
            echo "::error::VPS_HOST secret is not set."
            exit 1
          fi
          if [ -z "${SSH_PRIVATE_KEY}" ]; then
            echo "::error::VPS_SSH_PRIVATE_KEY secret is not set."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write key via env var — avoids template-expansion line-ending issues.
          install -m 600 /dev/null ~/.ssh/id_deploy
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_deploy
          sed -i 's/\r//' ~/.ssh/id_deploy

          echo "Key: $(wc -l < ~/.ssh/id_deploy) lines, $(wc -c < ~/.ssh/id_deploy) bytes"

          if ! ssh-keygen -y -f ~/.ssh/id_deploy >/dev/null 2>&1; then
            echo "::error::VPS_SSH_PRIVATE_KEY is not a valid private key."
            head -3 ~/.ssh/id_deploy
            exit 1
          fi
          echo "SSH key validated OK"

          ssh-keyscan -p "${VPS_PORT}" -H "${VPS_HOST}" >> ~/.ssh/known_hosts 2>/dev/null \
            || echo "::warning::ssh-keyscan miss — using StrictHostKeyChecking=accept-new"

      - name: Verify SSH connectivity
        run: |
          set -euo pipefail
          if ! ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
                 -p "${VPS_PORT}" "${VPS_USER}@${VPS_HOST}" 'echo "SSH OK on $(hostname)"'; then
            echo "::error::Could not SSH to ${VPS_USER}@${VPS_HOST}:${VPS_PORT}. Verify VPS_HOST/VPS_USER/VPS_SSH_PORT and that this key's public half is in the VPS ~/.ssh/authorized_keys."
            exit 1
          fi

      - name: Pull + rebuild backend on VPS
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -p "${VPS_PORT}" \
              "${VPS_USER}@${VPS_HOST}" bash -s <<'EOF'
          set -euo pipefail
          cd /opt/ab9d-ecommerce

          # Caddy owns port 80. Any system nginx (Contabo default install) must be
          # stopped and disabled so the two don't race for the port.
          if systemctl is-active --quiet nginx 2>/dev/null; then
            echo "Stopping system nginx (conflicts with Caddy on port 80)..."
            sudo systemctl stop nginx
            sudo systemctl disable nginx
          fi

          echo "Current commit (before): $(git rev-parse --short HEAD)"
          git fetch --quiet origin main
          git reset --hard origin/main
          echo "Current commit (after):  $(git rev-parse --short HEAD)"

          docker compose up -d --build backend
          # always restart caddy so it can bind port 80 now that nginx is gone
          docker compose up -d --force-recreate caddy
          # wait for health (caddy proxies / → backend:8080 → /healthz JSON)
          for i in $(seq 1 30); do
            if curl -fsS -m 3 http://127.0.0.1/healthz 2>/dev/null | grep -q '"status"'; then
              echo "Backend healthy after $i attempts"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy"
          docker compose logs --tail=50 backend
          docker compose logs --tail=20 caddy
          exit 1
          EOF
