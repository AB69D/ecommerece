name: Deploy backend to VPS

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - 'Caddyfile'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: # allow manual trigger from the Actions tab
  # last triggered: 2026-06-15 retry-2

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
      VPS_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
    steps:
      - name: Set up SSH
        env:
          SSH_KEY_B64: ${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail

          if [ -z "${VPS_HOST}" ]; then
            echo "::error::VPS_HOST secret is not set."
            exit 1
          fi
          if [ -z "${SSH_KEY_B64}" ]; then
            echo "::error::VPS_SSH_PRIVATE_KEY_B64 secret is not set."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Decode base64 key — zero newline/encoding issues.
          install -m 600 /dev/null ~/.ssh/id_deploy
          echo "${SSH_KEY_B64}" | base64 -d > ~/.ssh/id_deploy

          echo "Key: $(wc -l < ~/.ssh/id_deploy) lines, $(wc -c < ~/.ssh/id_deploy) bytes"

          if ! ssh-keygen -y -f ~/.ssh/id_deploy >/dev/null 2>&1; then
            echo "::error::VPS_SSH_PRIVATE_KEY_B64 decoded key is invalid."
            exit 1
          fi
          echo "SSH key validated OK"

          ssh-keyscan -p "${VPS_PORT}" -H "${VPS_HOST}" >> ~/.ssh/known_hosts 2>/dev/null \
            || echo "::warning::ssh-keyscan miss — using StrictHostKeyChecking=accept-new"

      - name: Verify SSH connectivity
        run: |
          set -euo pipefail
          if ! ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
                 -p "${VPS_PORT}" "${VPS_USER}@${VPS_HOST}" 'echo "SSH OK on $(hostname)"'; then
            echo "::error::Could not SSH to ${VPS_USER}@${VPS_HOST}:${VPS_PORT}. Verify VPS_HOST/VPS_USER/VPS_SSH_PORT and that this key's public half is in the VPS ~/.ssh/authorized_keys."
            exit 1
          fi

      - name: Pull + rebuild backend on VPS
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -p "${VPS_PORT}" \
              "${VPS_USER}@${VPS_HOST}" bash -s <<'EOF'
          set -euo pipefail
          cd /opt/ab9d-ecommerce

          # Caddy owns port 80. Any system nginx (Contabo default install) must be
          # stopped and disabled so the two don't race for the port.
          if systemctl is-active --quiet nginx 2>/dev/null; then
            echo "Stopping system nginx (conflicts with Caddy on port 80)..."
            sudo systemctl stop nginx
            sudo systemctl disable nginx
          fi

          echo "Current commit (before): $(git rev-parse --short HEAD)"
          git fetch --quiet origin main
          git reset --hard origin/main
          echo "Current commit (after):  $(git rev-parse --short HEAD)"

          echo "=== Remove orphan containers + ensure MongoDB is running ==="
          docker compose up -d --remove-orphans mongo1 mongo2 mongo3

          echo "=== Waiting for MongoDB containers to be healthy (up to 3 min) ==="
          for i in $(seq 1 36); do
            HEALTHY=$(docker compose ps mongo1 mongo2 mongo3 2>/dev/null | grep -c "healthy" || echo 0)
            echo "Attempt $i/36: $HEALTHY/3 mongo nodes healthy"
            if [ "$HEALTHY" -ge 3 ]; then
              echo "All MongoDB nodes healthy"
              break
            fi
            if [ "$i" -eq 36 ]; then
              echo "=== MongoDB never became healthy ==="
              docker compose logs --tail=30 mongo1
              docker compose ps
              exit 1
            fi
            sleep 5
          done

          echo "=== Run replica-set init (idempotent — safe to re-run) ==="
          docker compose up --wait --no-recreate mongo-rs-init 2>/dev/null || \
            docker compose run --rm mongo-rs-init 2>/dev/null || \
            echo "RS init already done or skipped — continuing"

          echo "=== Build + start backend ==="
          docker compose up -d --build backend 2>&1
          echo "=== Backend container status ==="
          docker compose ps backend

          echo "=== Early backend logs ==="
          for i in $(seq 1 6); do sleep 5; done
          docker compose logs --tail=40 backend

          # always restart caddy so it can bind port 80
          docker compose up -d --force-recreate caddy

          # wait for backend health (/healthz → backend:8080)
          BACKEND_OK=0
          for i in $(seq 1 60); do
            STATUS=$(curl -s -o /tmp/healthz_resp.txt -w "%{http_code}" -m 5 http://127.0.0.1/healthz 2>/dev/null || echo "000")
            BODY=$(cat /tmp/healthz_resp.txt 2>/dev/null || echo "")
            if echo "$BODY" | grep -q '"status"'; then
              echo "Backend healthy after $i attempts (HTTP $STATUS)"
              BACKEND_OK=1
              break
            fi
            echo "Attempt $i/60: HTTP $STATUS — $BODY"
            sleep 2
          done
          if [ "$BACKEND_OK" -eq 0 ]; then
            echo "=== BACKEND DID NOT BECOME HEALTHY ==="
            docker compose logs --tail=100 backend
            docker compose logs --tail=20 caddy
            docker compose ps
            echo "=== Direct port 8080 check ==="
            curl -fsS -m 5 http://127.0.0.1:8080/healthz 2>&1 || echo "Port 8080 unreachable"
            exit 1
          fi

          echo "=== Build + start frontend (Next.js) ==="
          docker compose up -d --build frontend 2>&1
          echo "=== Frontend container status ==="
          docker compose ps frontend
          docker compose logs --tail=20 frontend

          # Restart caddy so it can resolve the now-running frontend container
          docker compose up -d --force-recreate caddy

          echo "=== Waiting for frontend to respond (up to 2 min) ==="
          for i in $(seq 1 24); do
            FE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 10 http://127.0.0.1/ 2>/dev/null || echo "000")
            echo "Attempt $i/24: frontend HTTP $FE_STATUS"
            if [ "$FE_STATUS" = "200" ] || [ "$FE_STATUS" = "307" ] || [ "$FE_STATUS" = "308" ]; then
              echo "Frontend healthy after $i attempts (HTTP $FE_STATUS)"
              exit 0
            fi
            sleep 5
          done
          echo "=== FRONTEND DID NOT BECOME HEALTHY ==="
          docker compose logs --tail=50 frontend
          docker compose logs --tail=20 caddy
          docker compose ps
          exit 1
          EOF
